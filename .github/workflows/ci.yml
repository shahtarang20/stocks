name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check . || true   # non-blocking until ruleset is finalized
      - name: Alembic migration applies (sqlite)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q
      - name: Guardian service tests
        working-directory: apps/guardian
        run: pytest -q
      - name: Witness service tests
        working-directory: apps/witness
        run: pytest -q
      - name: Software TPM for the hardware-attestation e2e test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools
      - name: Proof-of-Privacy end-to-end (API + agent + SDK + guardian + software TPM)
        working-directory: .
        run: |
          pip install -e provider-agent -e sdk/python
          pytest -q -rs tests/e2e
          # The TPM test must not silently skip in CI.
          pytest -q -rs tests/e2e/test_tpm_swtpm_e2e.py | tee /tmp/tpm-e2e.txt
          ! grep -q "SKIPPED" /tmp/tpm-e2e.txt

  api-postgres:
    name: API on Postgres (migrations + full suite + concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: computecoin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: computecoin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U computecoin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      PG_URL: postgresql+asyncpg://computecoin:ci-only-password@localhost:5432/computecoin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Migrations up, down, up
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Reset database for the suite
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def main():
              e = create_async_engine(os.environ["PG_URL"])
              async with e.begin() as c:
                  await c.execute(text("DROP SCHEMA public CASCADE"))
                  await c.execute(text("CREATE SCHEMA public"))
              await e.dispose()
          asyncio.run(main())
          PY
      - name: Pytest on Postgres (includes postgres_only concurrency tests)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest -q -rs

  provider-agent:
    name: Provider agent (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  sdk-python:
    name: SDK python (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
      - run: pytest -q

  contracts:
    name: Contracts (Hardhat tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci || npm install
      - run: npm test
      # The launch-plan / pool validation library has its own offline tests; they never ran in CI.
      - run: npm run test:js

  sdk-typescript:
    name: SDK typescript (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (apps/api)
        working-directory: apps/api
        run: |
          python -m pip install -U pip pip-audit
          pip install -e ".[dev]" || pip install -e .
          pip-audit || true   # report advisories; non-blocking until triaged
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (apps/web)
        working-directory: apps/web
        run: |
          npm ci || npm install
          npm audit --omit=dev --audit-level=critical || true

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ------------------------------------------------------------------------------------------------------------------
  # Cross-platform plan W15: the same unit suites on a hosted Windows runner. NEVER RUN YET.
  # Hosted Windows runners have no GPU and cannot be assumed to run WSL2 with GPU, so GPU / WSL / isolation tests are NOT here:
  # they live in windows-host-e2e.yml on the self-hosted `windows-gpu` runner.
  # Advisory until the owner flips the repository variable WINDOWS_CI_BLOCKING to 'true' (do that after the first green
  # baseline: counts are compared with the Linux jobs). Until then a red job here shows up as a yellow check, not a failure.
  # ------------------------------------------------------------------------------------------------------------------
  windows:
    name: Windows (${{ matrix.suite }})
    runs-on: windows-latest
    continue-on-error: ${{ vars.WINDOWS_CI_BLOCKING != 'true' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [provider-agent, sdk-python, sdk-typescript, kits, operator-tooling]
    env:
      PYTHONUTF8: "1"          # the Windows default text encoding is a legacy code page; make the whole job UTF-8
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep LF line endings (Kit manifests, Dockerfiles and test vectors are compared byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.suite != 'sdk-typescript'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            provider-agent/pyproject.toml
            sdk/python/pyproject.toml
            apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        if: matrix.suite == 'sdk-typescript'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # ---- provider agent unit tests (PAL fakes; no GPU, no WSL, no Docker) ----
      - name: Provider agent tests
        if: matrix.suite == 'provider-agent'
        working-directory: provider-agent
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q -ra --junitxml=../junit-provider-agent.xml

      # ---- Python SDK (paths, UTF-8, canonical JSON, files written by PowerShell) ----
      - name: Python SDK tests
        if: matrix.suite == 'sdk-python'
        working-directory: sdk/python
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q -ra --junitxml=../../junit-sdk-python.xml

      # ---- TypeScript SDK on Windows Node ----
      - name: TypeScript SDK typecheck and tests
        if: matrix.suite == 'sdk-typescript'
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck
          npm test

      # ---- Kit CI gates: manifests, schemas, Dockerfile lint, smoke specs, and the Kit unit tests ----
      - name: Kit offline gate
        if: matrix.suite == 'kits'
        run: python scripts/kit_ci.py check --kits-dir kits
      - name: Kit unit tests
        if: matrix.suite == 'kits'
        run: |
          python -m pip install -U pip
          pip install -e "apps/api[dev]"   # kits/tests import app.services.* (schema validation and verify plug-ins)
          pytest -q -ra kits/tests --junitxml=junit-kits.xml

      # ---- operator tooling (tasks.py, key handling, PowerShell scripts' parse check) and helper tests that need no GPU ----
      - name: Operator tooling tests
        if: matrix.suite == 'operator-tooling'
        run: |
          python -m pip install -U pip
          pip install -e provider-agent -e sdk/python pytest==8.3.3
          pytest -q -ra tests/windows -m "not windows_gpu" --junitxml=junit-operator-tooling.xml
      - name: PowerShell scripts parse
        if: matrix.suite == 'operator-tooling'
        run: |
          $failed = 0
          foreach ($f in Get-ChildItem scripts/windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host "$($f.Name): $($_.Message)" }; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-windows-${{ matrix.suite }}
          path: junit-*.xml
          if-no-files-found: ignore
