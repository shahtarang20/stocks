[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computecoin-api"
version = "0.1.0"
description = "ComputeCoin API - Phase 1 backend foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    # REQUIRED for RS*/ES* id_token verification (PyJWT delegates asymmetric
    # crypto to it). Without it `_key_for` fails closed with
    # `sso_id_token_key_unsupported`, which means SSO is simply broken against
    # every real IdP: Okta, Entra ID, Google and Auth0 all sign RS256.
    "cryptography>=43.0.0",
    "redis==5.2.1",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "eth-account>=0.14.0",
    "stripe>=11.0.0",
    "sentry-sdk>=2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
