# Prometheus scrape config. OWNER DECISION: Prometheus + Grafana chosen as default.
# Set OBSERVABILITY_METRICS_TOKEN on the API and put the same value in token file below.
global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: computecoin-api
    metrics_path: /v1/ops/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/computecoin_metrics_token
    static_configs:
      - targets: ["api:8000"]
  # The ledger-imbalance gauge (alerts.yml: LedgerImbalance) is only exposed by the legacy /metrics endpoint, which has its own
  # token (METRICS_TOKEN; unset = open). Without this job that alert can never fire.
  - job_name: computecoin-api-ledger
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/computecoin_ledger_metrics_token  # holds METRICS_TOKEN
    static_configs:
      - targets: ["api:8000"]
