# ComputeCoin Sealed OS image (P5), declarative mkosi definition.
#
# TODO(verify-docs): option names below follow mkosi (>= v25) from memory of
# https://github.com/systemd/mkosi/blob/main/mkosi/resources/mkosi.md ; check against the pinned
# mkosi version in scripts/build.sh before the first real build and record URL + date here.
#
# What this image is: a Debian-based, read-only, dm-verity protected root, booted through a signed
# unified kernel image (UKI) whose kernel command line is baked in (and therefore measured into
# PCR 11 and covered by the Secure Boot signature). No sshd, no getty, no interactive login: the only
# thing running is the ComputeCoin agent and a hardened Docker daemon (ADR-0003).

[Distribution]
Distribution=debian
Release=trixie
# A dated snapshot mirror pins every package version, so two builds see the same bytes.
# build.sh substitutes SNAPSHOT_DATE (YYYYMMDDTHHMMSSZ) via --mirror; see scripts/build.sh.

[Output]
Format=disk
ImageId=computecoin-sealed
Output=computecoin-sealed
OutputDirectory=out
# Reproducibility: timestamps come from SOURCE_DATE_EPOCH (set by build.sh), seed is fixed.
Seed=6f1c3b9e-4f0e-4c1e-9a53-2d6a7b0c5e11
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=uki
UnifiedKernelImages=yes
Verity=yes
# Read-only root: the verity hash tree's root hash is in the UKI command line (roothash=).
RemoveFiles=/var/lib/apt /var/cache/apt /var/log/apt /etc/machine-id
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
RootPassword=
# No interactive login of any kind: root is locked, see mkosi.postinst.chroot.
Autologin=no
Hostname=computecoin-sealed
KernelCommandLine=
        lockdown=confidentiality
        intel_iommu=on
        amd_iommu=on
        iommu=force
        iommu.passthrough=0
        iommu.strict=1
        module.sig_enforce=1
        init_on_alloc=1
        init_on_free=1
        slab_nomerge
        systemd.mask=getty.target
        systemd.mask=serial-getty@.service
        systemd.mask=console-getty.service
        ro
        quiet
Packages=
        systemd
        systemd-boot
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        ca-certificates
        tpm2-tools
        libtss2-tcti-device0
        iptables
        docker.io
        python3
        python3-venv
        python3-pip
        linux-image-amd64
        nvidia-container-toolkit
# Deliberately absent: openssh-server, login/getty helpers, sudo, curl, wget, compilers.
RemovePackages=
        openssh-server
        sudo

[Validation]
SecureBoot=yes
# Key material is NEVER in the repo (R10). build.sh points these at files the CI / operator provides.
SecureBootKey=secureboot/db.key
SecureBootCertificate=secureboot/db.crt
# Verity root hash and UKI signature: PCR 11 signatures (systemd-measure) use a separate key.
SignExpectedPcr=yes
SignExpectedPcrKey=secureboot/pcr.key
SignExpectedPcrCertificate=secureboot/pcr.crt
