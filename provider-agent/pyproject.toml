[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computecoin-agent"
version = "0.1.0"
description = "ComputeCoin provider agent: detect hardware, enroll a machine, and send signed heartbeats."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ComputeCoin" }]
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.6.1",
    "typer==0.15.1",
    # typer 0.15.x uses the pre-8.2 click API (Parameter.make_metavar(ctx));
    # click>=8.2 breaks its help rendering, so pin a compatible click.
    "click==8.1.8",
    # tomli-w is tiny and lets us WRITE toml (tomllib in stdlib only reads).
    "tomli-w==1.0.0",
    # U10 interactive sessions: outbound WebSocket to the relay.
    "websockets==13.1",
    # Proof-of-Privacy (ADR-0005): X25519, Ed25519, ChaCha20-Poly1305, HKDF.
    "cryptography>=43.0.0",
    # Cross-platform plan W0: RAM / CPU detection without /proc (X8). Pinned.
    "psutil==6.1.0",
]

[project.optional-dependencies]
# GPU support is OPTIONAL. The agent runs CPU-only without these installed.
gpu = ["nvidia-ml-py==12.560.30"]
amd = ["amdsmi"]
# Windows supervisor (cross-platform plan W2): Windows Service, DPAPI and Credential Manager through pywin32, and native
# NVML telemetry. Installed only on Windows (environment marker). TODO(verify-docs): confirm pywin32 308 on PyPI for the
# supported Python versions before release; the package was not installed or checked here.
windows = [
    "pywin32==308; sys_platform == 'win32'",
    "nvidia-ml-py==12.560.30; sys_platform == 'win32'",
    "tzdata==2024.2; sys_platform == 'win32'",  # zoneinfo has no system time zone database on Windows
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
]

[project.scripts]
computecoin-agent = "computecoin_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["computecoin_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
