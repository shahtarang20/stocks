[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computecoin"
version = "0.1.0"
description = "Thin typed Python client for the ComputeCoin API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.11.7",
    # Proof-of-Privacy (ADR-0005): X25519, Ed25519, ChaCha20-Poly1305, HKDF.
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["computecoin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
